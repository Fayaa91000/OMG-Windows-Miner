name: Build OMG Windows Miner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Check Python source
        run: python -m py_compile app/main.py

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OMG-Windows-Miner app/main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OMG-Windows-Miner-EXE
          path: dist/OMG-Windows-Miner.exe
          if-no-files-found: error
