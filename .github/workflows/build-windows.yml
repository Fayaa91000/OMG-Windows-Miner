name: Build OMG Windows Miner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/prepare_xmrig.py'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Verify Python source
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/miner_controller.py
          python -m py_compile scripts/prepare_xmrig.py

      - name: Run 9 automated tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Download and verify official XMRig
        run: python scripts/prepare_xmrig.py

      - name: Build OMG Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OMG-Windows-Miner --add-binary "vendor/xmrig.exe;." app/main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OMG-Windows-Miner-Engine-Test
          path: dist/OMG-Windows-Miner.exe
          if-no-files-found: error
