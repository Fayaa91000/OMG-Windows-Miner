name: Build OMG Windows Miner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/prepare_xmrig.py'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Microsoft SignTool
        shell: pwsh
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $tools = @(Get-ChildItem $sdk -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue)
          if ($tools.Count -eq 0) {
            Write-Host "SignTool not found"
          } else {
            $tools | Select-Object -ExpandProperty FullName
          }

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Verify Python source
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/miner_controller.py
          python -m py_compile scripts/prepare_xmrig.py

      - name: Run 9 automated tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build OMG Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name OMG-Windows-Miner --add-data "app/assets/omg_logo_96.png;app/assets" app/main.py

      - name: Verify Windows dashboard package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = "dist/OMG-Windows-Miner/OMG-Windows-Miner.exe"

          if (-not (Test-Path $exe)) {
            throw "OMG Windows executable missing"
          }

          Write-Host "PASS: Windows executable exists"

          $bundled = Get-ChildItem "dist/OMG-Windows-Miner" `
            -Filter "xmrig.exe" -Recurse -File

          if ($bundled) {
            throw "Unexpected bundled XMRig executable"
          }

          Write-Host "PASS: XMRig is not bundled"

          @'
          import sys
          sys.path.insert(0, "app")

          import engine_installer
          import engine_verifier
          import windows_security
          import security_dialog
          import security_flow
          import installer_flow

          print("PASS: Windows security modules import")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Windows module import check failed"
          }

          Write-Host "PASS: Windows package checks completed"

      - name: Smoke-test packaged OMG dashboard startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location) "dist\OMG-Windows-Miner\OMG-Windows-Miner.exe"

          if (-not (Test-Path -LiteralPath $exe)) {
            throw "OMG packaged executable missing"
          }

          $process = Start-Process `
            -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) `
            -PassThru

          try {
            Start-Sleep -Seconds 8
            $process.Refresh()

            if ($process.HasExited) {
              throw "OMG exited during startup: $($process.ExitCode)"
            }

            Write-Host "PASS: OMG process remained running"
            Write-Host "No mining or XMRig installation requested"
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\OMG-Windows-Miner.iss"

      - name: Self-sign OMG installer for testing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=OMG Windows Miner Development TEST ONLY" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddMonths(3)

          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $tool = Get-ChildItem $sdk -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Select-Object -First 1

          if (-not $tool) {
            throw "Microsoft SignTool not found"
          }

          $exe = "dist-installer\OMG-Windows-Miner-Setup.exe"

          & $tool.FullName sign /sha1 $cert.Thumbprint `
            /s My /fd SHA256 $exe

          if ($LASTEXITCODE -ne 0) {
            throw "Signing failed"
          }

          $result = Get-AuthenticodeSignature $exe

          if ($result.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "Signature certificate mismatch"
          }

          Write-Host "PASS: OMG installer self-signed"
          Write-Host "Certificate: $($cert.Subject)"
          Write-Host "Trust status: $($result.Status)"
          Write-Host "TEST SIGNATURE ONLY - NOT PUBLICLY TRUSTED"

      - name: Scan OMG artifacts with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $status = Get-MpComputerStatus -ErrorAction Stop

          Write-Host "Defender service: $($status.AMServiceEnabled)"
          Write-Host "Antivirus enabled: $($status.AntivirusEnabled)"
          Write-Host "Signatures age: $($status.AntivirusSignatureAge) days"

          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw "NOT TESTED: Microsoft Defender antivirus unavailable or disabled"
          }

          $targets = @(
            "dist\\OMG-Windows-Miner",
            "dist-installer\\OMG-Windows-Miner-Setup.exe"
          )

          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target)) {
              throw "Scan target missing: $target"
            }

            Write-Host "Scanning: $target"
            Start-MpScan -ScanType CustomScan -ScanPath $target -ErrorAction Stop

            if (-not (Test-Path -LiteralPath $target)) {
              throw "Scan target missing after Defender scan: $target"
            }
          }

          $detections = @(Get-MpThreatDetection -ErrorAction Stop)

          foreach ($detection in $detections) {
            $resources = @($detection.Resources) -join " "
            if ($resources -match 'OMG-Windows-Miner|OMG Windows Miner') {
              throw "Defender reported an OMG-related threat detection"
            }
          }

          Write-Host "PASS: Defender scan commands completed"
          Write-Host "No OMG-related Defender detections reported"
          Write-Host "This does not establish Smart App Control approval"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OMG-Windows-Miner-Installer-Test
          path: dist-installer/OMG-Windows-Miner-Setup.exe
          if-no-files-found: error
